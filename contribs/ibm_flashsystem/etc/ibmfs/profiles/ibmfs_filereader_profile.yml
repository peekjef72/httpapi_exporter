---
ibmfs_filereader:
  modules:
    # WARNING: ./ at start of the module path is mandatory; else registry looks for the module in 'node_js' directory!
    # so path is absolute or ./path
    process: 'process'
    fs: 'fs'
    ibmfs: '$CONFIG_PATH/profiles/funcs/ibmfs.js'

  # all metrics will be named "[metric_prefix]_[metric_name]"
  metric_prefix: "ibmfs"
  scripts:
    init:
      - name: default headers
        set_fact:
          headers:
            - name: Content-type
              value: "application/json"
          scheme: https
          port: 7443
          verifySSL: false
          base_url: /rest/v1

    auth_check:
      - name: analyze login response ok
        set_fact:
          headers:
            - name: "X-Auth-token"
              value: $auth.token
          logged: true
          login_retry: $queryRetry
          # remove .login entry from symbols table
          # login: ~
        when:
          - 'js: status_code == 200 && auth !== undefined && auth.token != undefined'
      - name: analyze login response
        set_fact:
          logged: false
          login_retry: $queryRetry
          headers:
            - name: "X-Auth-token"
              action: delete
        when:
          - 'js: (status_code == 401) || (status_code == 403)'

      - name: analyze login response not ok with retry
        set_fact:
          logged: false
          login_retry: 'js: ++login_retry'
        when:
          - 'js: (status_code != 200) && (status_code != 401) && (status_code != 403)'

    login:
      - name: init login loop
        vars:
          login_retry: 0
          status_code: 0
        until: 'js: login_retry < queryRetry'

        actions:
          - name: login phase
            vars:
              headers:
                - name: 'X-Auth-Username'
                  value: supervision
                - name: 'X-Auth-Password'
                  value: "js: exporter.decryptPass( password, auth_key )"
            query:
              url: /auth
              method: post
              ok_status: 200
              # debug: true
              # don't store the value
              var_name: auth
              alternate: auth
              parser: json # default
          - name: analyze login response
            play_script: auth_check


    # method call to determine if a target is responding; will call login() if necessary
    ping:
      - name: read from files and say everything is OK
        set_fact:
          query_status: 200
          logged: true
          alternates: >-
            js:
              // MUST be set at startup to reach it
              var config_path = process.env("CONFIG_PATH")
              config_path = config_path == undefined || config_path == '' ? '.': config_path;
              if(config_path[config_path.length-1] == '/') {
                config_path[config_path.length-1]=0
              }
              // console.log('config_path=', config_path);
              var elements = [
                { name: 'lscurrentuser', file: 'ibmfs_lscurrentuser.json' },
                { name: 'auth', file: 'ibmfs_auth.json' },
                { name: 'lsenclosure', file: 'ibmfs_enclosure_metrics.json' },
                { name: 'lsenclosurecanister', file: 'ibmfs_enclosurecanister_metrics.json' },
                { name: 'lsenclosurepsu', file: 'ibmfs_enclosurepsu_metrics.json' },
                { name: 'lsenclosurebattery', file: 'ibmfs_enclosurebattery_metrics.json' },
                { name: 'lsportfc', file: 'ibmfs_portfc_metrics.json' },
                { name: 'lsportethernet', file: 'ibmfs_portethernet_metrics.json' },
                { name: 'lsquorum', file: 'ibmfs_quorum_metrics.json' },
                { name: 'lsarray', file: 'ibmfs_array_metrics.json' },
                { name: 'lspartition', file: 'ibmfs_partition_metrics.json' },
                { name: 'lsdrive', file: 'ibmfs_drive_metrics.json' },
                { name: 'lsdrivedetails', file: 'ibmfs_drivedetails_metrics.json' },
                { name: 'lssystemstats', file: 'ibmfs_systemstats_metrics.json' },
                { name: 'lssystem', file: 'ibmfs_system_metrics.json' },
              ];
              var res = {};
              for (var element of elements) {
                var buf = fs.readFileSync( config_path + '/profiles/samples/' + element.file)
                if( buf === undefined ) {
                  console.error("can't read content content from file", element.file);
                }
                else {
                  // console.log("nginx content read from file: " + buf);
                  res[element.name] = buf;
                }
              }
              res
      - name: check ping cnx
        query:
          # will call /api in fact !
          url: /lscurrentuser
          method: post
          ok_status: 200
          # debug: true
          # to catch and store the result and use it later...
          var_name: _
          alternate: lscurrentuser
