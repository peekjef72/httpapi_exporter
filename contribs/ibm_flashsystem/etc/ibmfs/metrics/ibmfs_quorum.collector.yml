collector_name: ibmfs_quorum_metrics
# no cache
# min_interval: 0s
metric_prefix: ibmfs_quorum


scripts:
  get_lsquorum:
    - name: get quorum
      query:
        url: /lsquorum
        var_name: results
        alternate: lsquorum
        # debug: true
        method: post
        # data: >-
        #   js:
        #     var data = { "filtervalue": "object_type=3" };
        #     JSON.stringify(data)
        data: '{ "filtervalue": "object_type=3" }'

    - name: proceed elements
      # scope: none # implicit to item
      loop: $results
      # loop_var: port
      when:
        - 'js: results.length > 0'
      metrics:
        - metric_name: status
          help: quorum status 0 Offline / 1 Online / 2 Degraded / 3 Unknown
          type: gauge
          key_labels:
            quorum_index: _
            object_type: _
            site_name: >
              js: (site_name.split('/'))[0]
          values: 
            _ : 'js: ibmfs.globalStatus(status)'
