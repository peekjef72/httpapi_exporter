collector_name: ibmfs_enclosure_metrics
# no cache
# min_interval: 0s
metric_prefix: ibmfs_enclosure


scripts:
  get_lsenclosure:
    - name: get enclosure
      query:
        url: /lsenclosure
        var_name: results
        alternate: lsenclosure
        # debug: true
        method: post

    - name: proceed elements
      scope: none
      loop: $results
      loop_var: enclosure
      when:
        - 'js: results.length > 0'
      metrics:
        - metric_name: status
          help: enclosure status 0 Offline / 1 Online / 2 Degraded / 3 Unknown
          type: gauge
          key_labels:
            enclosure_id: $enclosure.id
            serial_number: $enclosure.serial_number
          values: 
            _: 'js: ibmfs.globalStatus(enclosure.status)'
