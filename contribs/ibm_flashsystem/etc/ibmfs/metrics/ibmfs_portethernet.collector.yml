collector_name: ibmfs_portethernet_metrics
# no cache
# min_interval: 0s
metric_prefix: ibmfs_portethernet


scripts:
  get_lsportethernet:
    - name: get ethernet ports
      query:
        url: /lsportethernet
        var_name: results
        alternate: lsportethernet
        # debug: true
        method: post

    - name: proceed elements
      # scope: none # implicit to item
      loop: $results
      # loop_var: port
      when:
        - 'js: results.length > 0'
      metrics:
        - metric_name: status
          help: interface status 0 inactive / 1 active / 2 unknown
          type: gauge
          key_labels:
            port_id: _
            node_name: _
          values: 
            _: 'js: ibmfs.portStatus(link_state)'

        - metric_name: speed_bps
          help: interface speed in bits per second
          type: gauge
          key_labels:
            port_id: _
            node_name: _
          values: 
            _ : 'js: ibmfs.ethernetSpeed(speed)'

        - metric_name: duplex
          help: interface duplex status 0 unknown / 1 Half / 2 Full
          type: gauge
          key_labels:
            port_id: _
            node_name: _
          values: 
            _ : 'js: ibmfs.ethernetDuplex(duplex)'
